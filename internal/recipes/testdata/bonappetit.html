<script type="application/ld+json">{"@context":"http://schema.org","@type":"Recipe","articleBody":"Food director Chris Morocco spent months developing this chocolate chip cookie recipe—testing 30 batches, then cross-testing 10 more—to land on what he considers the icon’s Platonic ideal: intentionally thin cookies with deeply caramelized flavor, crisp edges, and a soft, chewy center. Rooted in classic Toll House DNA, the recipe is elevated with brown butter for nutty depth and a higher proportion of brown sugar for richness and chew.\nBecause the dough also has a high butter-to-flour ratio, small variables—like kitchen temperature, flour brand, or how warm the dough is when it goes into the oven—can affect how much the cookies spread. When those factors are in balance, the payoff is chocolate chip cookies with rippled edges, puddles of melted chocolate, and a texture that sets as it cools.\nTips for the best chocolate chip cookies\nExpect spread: This recipe is designed to bake up thin, with crisp, rippled edges. For slightly thicker cookies with less spread, chill the dough overnight or portion it into balls and freeze (dough balls can be baked straight from the freezer). Using a higher-protein all-purpose flour, such as King Arthur, can also help limit spreading. Avoid silicone baking mats here as they encourage spreading.\nMeasure flour precisely: We strongly recommend weighing your flour and sugar. If using volume measures, spoon ingredients into your measuring cup, then level with a flat-edged utensil. Undermeasuring flour can lead to greasy cookies, while overmeasuring sugar can make them flat.\nWatch the bake, not the clock: Timing is a guideline and may vary based on oven calibration and kitchen conditions, so trust the visual cues above all else. Pull the cookies when the edges are deep golden, and the centers look just underdone; they’ll firm up as they cool.\nBrown the butter thoroughly: Browning butter adds a rich, toffee-like flavor and reduces its water content (important for the cookie’s texture). Use a light-colored pan and cook until the milk solids turn deep golden brown. Have the remaining butter at the ready, but still cold, to stop the cooking and protect those toasty bits from turning black and bitter.\nMind the dough temperature: If your kitchen runs warm or the dough feels loose after mixing—especially if the brown butter was still warm—chill the dough briefly before baking. Starting with cool dough can mitigate spreading.\nMore great chocolate chip cookie recipes:","alternativeHeadline":"Crisp edges, chewy centers, melty chocolate chunks, and nutty, rich brown-butter flavor—these chocolate chip cookies deliver classic comfort in every bite.","keywords":["recipe all-star","baking","dessert","cookie","chocolate","snack","christmas","easy","web"],"thumbnailUrl":"https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/1:1/w_2700,h_2700,c_limit/chocolate-chip-cookie.jpg","publisher":{"@context":"https://schema.org","@type":"Organization","name":"Bon Appétit","logo":{"@type":"ImageObject","url":"https://www.bonappetit.com/verso/static/bonappetit-us/assets/logo-seo.png","width":"479px","height":"100px"},"url":"https://www.bonappetit.com"},"isPartOf":{"@type":"CreativeWork","name":"Bon Appétit"},"isAccessibleForFree":true,"author":[{"@type":"Person","name":"Chris Morocco","sameAs":"https://www.bonappetit.com/contributor/chris-morocco"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":4.5,"ratingCount":1439},"description":"Crisp edges, chewy centers, melty chocolate chunks, and nutty, rich brown-butter flavor—these chocolate chip cookies deliver classic comfort in every bite.","image":["https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/16:9/w_4800,h_2700,c_limit/chocolate-chip-cookie.jpg","https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/4:3/w_3600,h_2700,c_limit/chocolate-chip-cookie.jpg","https://assets.bonappetit.com/photos/5ca534485e96521ff23b382b/1:1/w_2700,h_2700,c_limit/chocolate-chip-cookie.jpg"],"inLanguage":"en-US","headline":"BA’s Best Chocolate Chip Cookies","name":"BA’s Best Chocolate Chip Cookies","cookTime":"20 minutes","recipeIngredient":["1½ cups plus 1 Tbsp. (200 g) all-purpose flour (spooning into measuring cups, then leveling)","1¼ tsp. (4 g) Diamond Crystal or ¾ tsp. (4 g) Morton kosher salt","¾ tsp. (4 g) baking soda","¾ cup (1½ sticks; 169 g) unsalted butter, divided","1 cup (200 g) (packed) dark brown sugar","¼ cup (50 g) granulated sugar","1 large egg","2 large egg yolks","2 tsp. vanilla extract","6 oz. (170 g) bittersweet chocolate (60%–70% cacao), coarsely chopped, or semisweet chocolate chips"],"recipeInstructions":[{"@type":"HowToStep","text":"Place racks in upper and lower thirds of oven; preheat to 375°. Whisk 1½ cups plus 1 Tbsp. (200 g) all-purpose flour, 1¼ tsp. (4 g) Diamond Crystal or ¾ tsp. (4 g) Morton kosher salt, and ¾ tsp. (4 g) baking soda in a small bowl; set flour mixture aside."},{"@type":"HowToStep","text":"Cook ½ cup (1 stick; 113 g) unsalted butter in a large saucepan over medium heat, swirling often and scraping bottom of pan with a heatproof rubber spatula, until butter foams, then browns, about 4 minutes. Scrape melted butter and any brown bits to a large heatproof mixing bowl and let cool 1 minute. Cut remaining ¼ cup (½ stick; 56 g) unsalted butter into small pieces and add to brown butter (it should start to melt but not foam and sizzle, so test with one piece before adding the rest)."},{"@type":"HowToStep","text":"Once butter is melted, add 1 cup (200 g) (packed) dark brown sugar and ¼ cup (50 g) granulated sugar and whisk, breaking up any clumps, until sugar is incorporated and no lumps remain. Add 1 large egg and 2 large egg yolks and whisk until sugar dissolves and mixture is smooth, about 30 seconds. Whisk in 2 tsp. vanilla extract. Using rubber spatula, fold reserved dry ingredients into butter mixture just until no dry spots remain, then fold in 6 oz. (170 g) bittersweet chocolate (60%–70% cacao), coarsely chopped, or semisweet chocolate chips (the cookie dough will be soft but should hold its shape once scooped; if it slumps or oozes after being scooped, stir dough back together several times and let rest 5–10 minutes until scoops hold their shape as the flour hydrates)."},{"@type":"HowToStep","text":"Using a 1½-oz. scoop (3 Tbsp.), portion out 16 balls of dough and divide between 2 parchment-paper-lined rimmed baking sheets. Bake cookies, rotating sheets if cookies are browning very unevenly (otherwise, just leave them alone), until deep golden brown and firm around the edges, 8–10 minutes. Let cool on baking sheets.\nDo Ahead: Dough balls can be portioned 3 months ahead; freeze on cookie sheets and then transfer to a resealable plastic bag. Bake from frozen, adding 1–2 minutes onto the cook time. Cookies can be baked 3 days ahead. Store in an airtight container at room temperature.\nEditor’s note: This recipe was first printed in April 2019 as “BA’s Best Chocolate Chip Cookies”; it has been updated for style. Head this way for more easy cookie recipes →"}],"totalTime":"40 minutes","recipeYield":"Makes 16","url":"https://www.bonappetit.com/recipe/bas-best-chocolate-chip-cookies","dateModified":"2026-01-31T09:00:00.000-05:00","datePublished":"2019-04-25T06:00:00.000-04:00"}</script>
