 quick and easy dinner dream.","duration":"PT23S","contentUrl":"https://mos-streaming.hearst.io/bb7f0f2b-a0c2-4e7b-b04b-9d37a9af17e9/video_9x16_1080p_hd.mp4","embedUrl":"https://www.delish.com/cooking/recipe-ideas/a19636089/creamy-tuscan-chicken-recipe/","inLanguage":"en"},"description":"This skillet chicken dinner pairs chicken breasts with a bright and creamy sauce, spinach, and baby tomatoes for a quick and easy dinner dream. ","author":{"name":"Lena Abraham","url":"https://www.delish.com/author/17077/lena-abraham/","@type":"Person","description":"\u003cp>Lena Abraham is a freelance contributor with Delish, and was formerly Senior Food Editor, where she developed and styled recipes for video and photo, and also stayed on top of current food trends. She’s been working in the food industry for over 10 years, and will argue that the best fish tacos in the world are made in New York. Don’t @ her.\u003c/p>","jobTitle":"Contributor","image":"https://hips.hearstapps.com/rover/profile_photos/846121db-9644-42e0-a4fd-cf5d105bfdf9_1576786748.file","email":"Lena.Abraham@hearst.com","knowsAbout":["Meals & Cooking","Occasions","Food Trends","Kitchen Tips","Food News"]},"name":"Creamy Tuscan Chicken","prepTime":"PT10M","cookTime":"PT0S","totalTime":"PT45M","recipeIngredient":["1 tbsp. extra-virgin olive oil","4 (6- to 8-oz.) boneless, skinless chicken breasts","Kosher salt","Freshly ground black pepper","1 tsp. dried oregano","3 tbsp. unsalted butter","3 garlic cloves, minced","1 1/2 c. cherry tomatoes, halved","3 c. baby spinach","1/2 c. heavy cream","1/2 oz. Parmesan, finely grated (about 1/4 cup)","Lemon wedges, for serving"],"recipeInstructions":[{"@type":"HowToStep","text":"In a large skillet over medium heat, heat oil. Sprinkle chicken all over with salt, pepper, and oregano. Cook, turning halfway through, until browned on both sides and an instant-read thermometer inserted into thickest part registers 165°, about 8 minutes per side. Transfer to a plate."},{"@type":"HowToStep","text":"In same skillet over medium heat, melt butter. Stir in garlic and cook, stirring, until fragrant, about 1 minute. Add tomatoes; season with salt and pepper. Cook, stirring, until tomatoes are beginning to burst, about 5 minutes. Add spinach and cook, stirring, until spinach is beginning to wilt, 2 to 3 minutes more."},{"@type":"HowToStep","text":"Stir in cream and Parmesan and bring to a simmer. Reduce heat to low and continue to simmer, stirring occasionally, until sauce is slightly reduced, about 3 minutes. Return chicken to skillet and cook, stirring occasionally, until heated through, 5 to 7 minutes."},{"@type":"HowToStep","text":"Divide chicken among plates. Spoon sauce over. Serve with lemon wedges alongside."}],"recipeYield":"4 serving(s)","recipeCuisine":["Poultry Cuisine","Chicken Cuisine","Cream Cuisine","Tomato Cuisine","Garlic Cuisine","Spinach Cuisine","Butter Cuisine","Oil Cuisine","Herb Cuisine","Oregano Cuisine","Lemon Cuisine","Mediterranean Cuisine","Italian Cuisine","European Cuisine"],"recipeCategory":["easy chicken","weeknight meals","dinner","poultry"],"aggregateRating":{"@type":"AggregateRating","ratingValue":4.878788,"reviewCount":396,"worstRating":1,"bestRating":5,"@context":"http://schema.org/"},"nutrition":{"@type":"NutritionInformation","calories":" 502 Calories","fatContent":"30 g","saturatedFatContent":"15 g","transFatContent":"0 g","cholesterolContent":"208 mg","sodiumContent":"767 mg","carbohydrateContent":"4 g","fiberContent":"1 g","sugarContent":"3 g","proteinContent":"50 g"},"comment":[{"@context":"http://schema.org/","@type":"Comment","datePublished":"2020-04-28","author":{"@context":"http://schema.org/","@type":"Person","name":"RedBullhorn"},"text":"Making this tonight for me and my girlfriend's 1 year anniversary. Wish me luck!","upvoteCount":207,"downvoteCount":21},{"@context":"http://schema.org/","@type":"Comment","datePublished":"2022-08-28","author":{"@context":"http://schema.org/","@type":"Person","name":"BlueBowtie"},"text":"Made this tonight it was awesome and so easy don’t need the recipe for next time thank you","upvoteCount":13,"downvoteCount":0},{"@context":"http://schema.org/","@type":"Comment","datePublished":"2020-02-12","author":{"@context":"http://schema.org/","@type":"Person","name":"OliveAirBalloon"},"text":"I made this for my wife (2/20/20) She yelled before I could get to the table with my plate so I knew it was good. Lol. It is very very good.","upvoteCount":50,"downvoteCount":3},{"@context":"http://schema.org/","@type":"Comment","datePublished":"2020-01-21","author":{"@context":"http://schema.org/","@type":"Person","name":"RedWrench"},"text":"Would it be good to use broccoli instead of spinach? Out of spinach have broccoli","upvoteCount":64,"downvoteCount":27},{"@context":"http://schema.org/","@type":"Comment","datePublished":"2019-12-18","author":{"@context":"http://schema.org/","@type":"Person","name":"PurpleBeer"},"text":"Can you add noodles to this?","upvoteCount":17,"downvoteCount":2},{"@context":"http://schema.org/","@type":"Comment","datePublished":"2020-08-29","author":{"@context":"http://schema.org/","@type":"Person","name":"JoyfulJen"},"text":"We loved this! I also added mushrooms, just because we love them, and also used a full cup of heavy cream and a full cup of grated Parmesan. I also used mixed colored tomatoes and it was beautiful, as well. Served it with angel hair pasta and fresh roasted asparagus from the air fryer, tossed in a bit of olive oil, salt, and pepper. Big hit at our house- and SO easy!","upvoteCount":12,"downvoteCount":5}],"review":[{"@context":"http://schema.org/","@type":"Review","datePublished":"2022-06-06","author":{"@context":"http://schema.org/","@type":"Person","name":"PurpleFries"},"reviewBody":"This is great!!  I either need to skip the salt at the last stage, or I need to drink less when cooking. I will go with option 1.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-04-24","author":{"@context":"http://schema.org/","@type":"Person","name":"RedController"},"reviewBody":"Turned out delicious! I tripled the sauce, spinach, tomatoes, and didn’t measure the cheese but used almost the whole bag. I also placed it over linguini 🤤😋","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2023-05-14","author":{"@context":"http://schema.org/","@type":"Person","name":"Kwitts"},"reviewBody":"\u003cp>I make this probably once a week because it is SO GOOD. I double the sauce recipe (more butter, more cream, more parm, etc) and serve is all over pasta (bowties work well with it). The addition of salt to the sauce later on is honestly unnecessary, it's seasoned well without it. This is one of my go to recipes for when we have guests and every time I make it I get compliments. \u003c/p>","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-05-19","author":{"@context":"http://schema.org/","@type":"Person","name":"OliveFlower"},"reviewBody":"I am not a cook, but I wanted to impress the better half. This recipe looked tasty and pretty simple for me to do. WOW! It was a resounding success, we both loved it, and that sauce is definitely amazing! If I can make this, literally anyone can. Thank you!","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2021-12-14","author":{"@context":"http://schema.org/","@type":"Person","name":"PurpleHammer"},"reviewBody":"I make this with shrimp too and instead of tomatoes I always use julienne sun dried tomatoes (the ones packed in oil, but drained) and of course I also always double my sauce (cream and parm) . IF I have white wine on hand I add a dash of it and sometimes I add spinach (depends on who I am cooking it for and the setting)  . Above all, try the sun dried tomatoes- it elevates the flavor since there is a bit of sweetness in them. This dish is, not only an easy dish to make and hard to mess up (if u use the foundational ingredients), but it's an elegant dish as well.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2021-10-23","author":{"@context":"http://schema.org/","@type":"Person","name":"PurpleController"},"reviewBody":"This is hands down the most delicious thing I've ever eaten. So incredibly delicious.\n\nI cut the chickens up in to bite size pieces and season it generously with garlic and onion powder, thyme, oregano, parsley, salt and pepper before cooking.\n\nI triple the cream, cheese and tomatoes, and cook it down a little bit longer. 5-10 min.   I serve it with penne or linguine. And generously sprinkle more of the cheese on top, skipping the lemon wedge.  Absolutely incredible. I sit at my table and just go MMMMMM and SO GOOD!!!  my husband loves it as much as I do.\n\nBest part is that it's so simple to make. Hardest part is cutting up the chicken, and you don't even have to do that. \n\nPicture is from the first time I made it. Have made it many times since.  It looks just like the recipe picture! So beautiful. So good! Make this!!","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-01-18","author":{"@context":"http://schema.org/","@type":"Person","name":"OrangeElephant"},"reviewBody":"Soooo good! This will be added to the rotation. Thank you for this one! I doubled the cream and spinach, added some pepper flakes too. \nAlso, why are we being so sensitive to cuss words ? It’s clearly an enthusiastic compliment 🙄","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-02-24","author":{"@context":"http://schema.org/","@type":"Person","name":"GoldFan"},"reviewBody":"I'm but a young lad of 20 years of age. I've been cooking for a while now but mostly just for myself or whatever. Occasionally I cook for my family or my girlfriend's. I decided to make this for my mom and pops one night and I'm telling you that it slammed. I added mushrooms (and planned to add zucchini and asparagus among other greens but forgot to because of a time crunch) during the same step of adding in the tomatoes to the pan and the entire dish turned out absolutely amazing. It took me a bit longer than an hour to make it, but that's because I also cooked rice. Serving the chicken on a bed of rice and pouring some of that sauzzz over it really was the right move. Everything was super flavorful and I swear this was the juiciest and most tender chicken I've ever had in my life. As an aside, I suppose I had thicker chicken breasts because my cook time in the sauce was closer to 10-20 minutes rather than the 5-7 that they said. Could've also been that I didn't cook the chicken long enough prior to that. Either way, Wich thicker breasts be prepared for a longer cook time in either stage. Another aside, my father said that I should open up a restaurant after I made this for him. Another aside, I did take some liberties in seasoning, but I made this a while ago and don't really remember what I changed or added.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-05-16","author":{"@context":"http://schema.org/","@type":"Person","name":"OrangeMagnet"},"reviewBody":"I used fish, because I didn't have chicken. I substituted Mrs Dash for salt, because of my high blood pressure. I'm on a low fat diet so I used water instead of cream. I then ran out of minced garlic, so I used garlic powder. I don't like pepper, oregano, tomatoes and spinach, so I just skipped that. Finally, I used saltines instead of cheese to throw in a wild card. Not sure what went wrong, but it tasted disgusting. I wouldn't recommend it, at all. I almost left a bad review, but decided to maybe try the actual recipe. Surprisingly, it was incredible. Yummmm! Maybe there's something to using the listed ingredients.\n\nHahahaaa. All kidding aside, here's a piece of advice to achieve excellent recipes (that others have already taste tested):\n1) If you're looking for keto, low fat, low cal, etc, there's plenty of speciality sites that have tons of similar recipes, just for you. \n2) If you don't have an ingredient, go to the store and get it, or find a recipe that calls for ingredients that you do have. \n3) Finally, if you don't like things in it, move on.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2023-12-21","author":{"@context":"http://schema.org/","@type":"Person","name":"rsnyder"},"reviewBody":"\u003cp>This is SO good, even my picky 14 year old told me several times how good it was. My 8 year old tolerated it, but she's pretty picky. Will be on our regular rotation for sure! I think I'll add a whole bag of spinach and sun-dried tomatoes next time in addition to the regular tomatoes. I did end up adding some starchy pasta water to the sauce at the end to help thicken it up a little more. \u003c/p>","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-01-21","author":{"@context":"http://schema.org/","@type":"Person","name":"OliveProcessor"},"reviewBody":"This is amazing! 😍 I might double up on the sauce next time - I texted this to like 15ppl to make! It's now one of my husband's all time faves","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2021-09-26","author":{"@context":"http://schema.org/","@type":"Person","name":"OliveDog"},"reviewBody":"Delicious!!! And VERY easy! Took everyone’s advice and doubled the sauce. Used skinless thighs. Added fresh oregano and saffron to the sauce at the end and let it simmer before adding the chicken. Put everything in a casserole on warm in the oven while guests ate appetizers and sipped cocktails. Pan fried polenta rounds to serve chicken over. Opened  a good red and served with crusty warm French bread and salad greens. Good meal, great company - all on a sultry fall night on the patio. Amazing","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-02-15","author":{"@context":"http://schema.org/","@type":"Person","name":"OrangeSubmarine"},"reviewBody":"Great make ahead meal for my truck driving husband.  I do a weeks meal prep for him and this one turned out perfect.  Added a side of asparagus.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-05-21","author":{"@context":"http://schema.org/","@type":"Person","name":"OliveCone"},"reviewBody":"I made this for my family tonight, I also added some penne at the end to feed more. This recipe was super easy to follow, I loved how it was a one pan dish, turned out SUPER TASTY! This will definitely be a recipe I go back to again and again to make!!","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-02-09","author":{"@context":"http://schema.org/","@type":"Person","name":"PurpleBottle"},"reviewBody":"I have to agree with the other reviews, this is fantastic! I've made it 3 times in the last month alone. I used grape tomatoes, quartered portabella mushrooms and served it on spaghetti. When I didn't have spinach on hand I used spring mix. My daughter said \"you WILL make this for me!\"","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-01-18","author":{"@context":"http://schema.org/","@type":"Person","name":"BlueFlask"},"reviewBody":"This was absolutely delicious! The chicken needed a bit more cooking and I added wayyyyyyyyyyy more parm. I mean who doesn't like parm?!","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2020-05-15","author":{"@context":"http://schema.org/","@type":"Person","name":"RedBandAid"},"reviewBody":"My husband said, \"this is my favorite dish you've made yet!\"  (We've been married 8 months!)\nI used sun-dried tomatoes instead of fresh tomatoes.  For the oil, I used the oil that the tomatoes come in.  It was super delicious.  Served with spaghetti noodles.  SO GOOD.","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2023-02-16","author":{"@context":"http://schema.org/","@type":"Person","name":"ale8117"},"reviewBody":"\u003cp>Double the sauce amount if serving over pasta. We served over linguine and holy cow it was DELICIOUS!!! Definitely have all ingredients ready to go because the recipe goes quick. Very versatile recipe, will be adding mushrooms to it next time we make it!\u003c/p>","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}},{"@context":"http://schema.org/","@type":"Review","datePublished":"2021-11-04","author":{"@context":"http://schema.org/","@type":"Person","name":"Teowonna"},"reviewBody":"This was delicious! I made it exactly as the recipe states... EXCEPT, I used chicken thighs instead of breasts because of my affinity for fat. This was the first time that I've ever made a recipe that looked exactly like the pictures. It was beautiful with vibrant colors and textures. Served with rice and asparagus but no additional veggies were necessary. oh yeah, the man loved it too!","reviewRating":{"@context":"http://schema.org/","@type":"Rating","ratingValue":5,"worstRating":1,"bestRating":5}}],"commentCount":767}]</script>
