/\/www.recipetineats.com\/lasagna\/"]}]},{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/www.recipetineats.com\/lasagna\/#primaryimage","url":"https:\/\/www.recipetineats.com\/tachyon\/2025\/03\/Lasagna_6-1.jpg","contentUrl":"https:\/\/www.recipetineats.com\/tachyon\/2025\/03\/Lasagna_6-1.jpg","width":1200,"height":1499},{"@type":"BreadcrumbList","@id":"https:\/\/www.recipetineats.com\/lasagna\/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https:\/\/www.recipetineats.com\/"},{"@type":"ListItem","position":2,"name":"Collections","item":"https:\/\/www.recipetineats.com\/category\/collections\/"},{"@type":"ListItem","position":3,"name":"Winter Warmers","item":"https:\/\/www.recipetineats.com\/category\/collections\/winter-recipe-collection\/"},{"@type":"ListItem","position":4,"name":"Lasagna!"}]},{"@type":"WebSite","@id":"https:\/\/www.recipetineats.com\/#website","url":"https:\/\/www.recipetineats.com\/","name":"RecipeTin Eats","description":"Fast Prep, Big Flavours","potentialAction":[{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https:\/\/www.recipetineats.com\/?s={search_term_string}"},"query-input":{"@type":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}],"inLanguage":"en-US"},{"@type":"Person","@id":"https:\/\/www.recipetineats.com\/#\/schema\/person\/1684e6a75e9f91ae2e33ca2de95b47e2","name":"Nagi","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","url":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","caption":"Nagi"},"description":"I believe you can make great food with everyday ingredients even if you’re short on time and cost conscious. You just need to cook clever and get creative!","sameAs":["http:\/\/www.recipetineats.com\/about-me\/"],"url":"https:\/\/www.recipetineats.com\/author\/nagi-maehashigmail-com\/"},{"@type":"Recipe","name":"Lasagna","author":{"@id":"https:\/\/www.recipetineats.com\/#\/schema\/person\/1684e6a75e9f91ae2e33ca2de95b47e2"},"description":"Recipe video above. One of my signature recipes! This is a lasagna made the traditional Italian way, with a slow cooked ragu and a béchamel sauce (&quot;Besciamella&quot;). No ricotta - that&#39;s the American-Italian version. Though it requires patience to make, it is worth every minute. The ragu bolognese is melt-in-you-mouth tender and the sauce is rich and thick.  Makes 8 giant or 10 normal servings. This lasagna has 4 layers of lasagna sheets with 3 layers of meat and cheese sauce, then finished with a cheese sauce topping. You could stretch it to 4 ragu layers. If making 5 layers, scale up the recipe by 25% (click on servings and slide) and use a very deep pan!","datePublished":"2017-05-19T16:00:00+00:00","image":["https:\/\/www.recipetineats.com\/tachyon\/2017\/05\/Lasagne-recipe-3-main-square.jpg","https:\/\/www.recipetineats.com\/tachyon\/2017\/05\/Lasagne-recipe-3-main-square.jpg?resize=500%2C500","https:\/\/www.recipetineats.com\/tachyon\/2017\/05\/Lasagne-recipe-3-main-square.jpg?resize=500%2C375","https:\/\/www.recipetineats.com\/tachyon\/2017\/05\/Lasagne-recipe-3-main-square.jpg?resize=480%2C270"],"recipeYield":["10"],"prepTime":"PT20M","cookTime":"PT240M","totalTime":"PT260M","recipeIngredient":["1 tbsp olive oil","1  onion (, finely chopped (white, yellow or brown))","1  medium carrot (, peeled and very finely diced)","1  celery stick (, very finely diced)","2  garlic cloves (, minced)","1 kg \/ 2 lb  beef mince ((ground beef) (Note 1))","800g \/ 28 oz  canned crushed tomato","1\/4 cup tomato paste","1 cup pinot noir red wine (, or other dry red wine (Note 2))","3  beef bouillon cubes (, crumbled)","2  bay leaves (, dried or fresh)","1\/2 tsp EACH dried thyme and oregano","2 tsp Worcestershire Sauce","1 - 2 tsp sugar ((if needed - Note 3))","1\/2 tsp salt and black pepper","60g \/ 4 tbsp  butter","1\/2 cup flour","4 cups milk (, preferably full fat but low fat ok)","2 cups gruyere or Colby cheese (, shred yourself (or cheddar, Monterey Jack, OR 1 cup \/ 100g shredded parmesan) (Note 4))","Pinch of freshly ground nutmeg","Salt and pepper","350g\/ 12 oz  fresh lasagna sheets ((or 250g\/8oz dried) (Note 5))","1 1\/2 cups (tightly packed) mozzarella cheese (, shred yourself (Note 4))","Finely chopped basil or parsley (, for garnish (optional))"],"recipeInstructions":[{"@type":"HowToSection","name":"Ragu:","itemListElement":[{"@type":"HowToStep","text":"Heat oil in a large heavy based pot over medium heat. Add garlic, onion, celery and carrots. Cook for 10 minutes until softened and sweet - they should not brown (if they do, turn heat down).","name":"Heat oil in a large heavy based pot over medium heat. Add garlic, onion, celery and carrots. Cook for 10 minutes until softened and sweet - they should not brown (if they do, turn heat down).","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-0-0"},{"@type":"HowToStep","text":"Add beef, turn heat up and cook the beef, breaking it up as you go.","name":"Add beef, turn heat up and cook the beef, breaking it up as you go.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-0-1"},{"@type":"HowToStep","text":"Once the beef has all turned brown, add the remaining Ragu ingredients EXCEPT the sugar.","name":"Once the beef has all turned brown, add the remaining Ragu ingredients EXCEPT the sugar.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-0-2"},{"@type":"HowToStep","text":"Stir then adjust the heat so it is bubbling very gently. Place the lid on and cook for 1.5 - 2 hours, stirring every now and then, then remove the lid and simmer for 30 minutes.","name":"Stir then adjust the heat so it is bubbling very gently. Place the lid on and cook for 1.5 - 2 hours, stirring every now and then, then remove the lid and simmer for 30 minutes.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-0-3"},{"@type":"HowToStep","text":"The ragu is ready when the meat is really tender and the sauce has thickened and is rich - see video for consistency (Note 6). Adjust salt and pepper to taste, and add sugar if required (Note 3)","name":"The ragu is ready when the meat is really tender and the sauce has thickened and is rich - see video for consistency (Note 6). Adjust salt and pepper to taste, and add sugar if required (Note 3)","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-0-4"}]},{"@type":"HowToSection","name":"Cheese Sauce:","itemListElement":[{"@type":"HowToStep","text":"Warm milk up in a saucepan (optional - just makes sauce thicken faster).","name":"Warm milk up in a saucepan (optional - just makes sauce thicken faster).","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-1-0"},{"@type":"HowToStep","text":"In a large saucepan, melt butter over medium low heat. Add flour and mix constantly for 1 minute.","name":"In a large saucepan, melt butter over medium low heat. Add flour and mix constantly for 1 minute.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-1-1"},{"@type":"HowToStep","text":"Pour about 1 cup of the milk in, mixing as you go to incorporate into the flour mixture. Once mostly lump free, add remaining milk. Use a whisk if needed to make it lump free.","name":"Pour about 1 cup of the milk in, mixing as you go to incorporate into the flour mixture. Once mostly lump free, add remaining milk. Use a whisk if needed to make it lump free.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-1-2"},{"@type":"HowToStep","text":"Turn heat up to medium high. Stir occasionally at first then regularly after a few minutes until sauce thickens - about 5 - 8 minutes. It should coat the back of the wooden spoon.","name":"Turn heat up to medium high. Stir occasionally at first then regularly after a few minutes until sauce thickens - about 5 - 8 minutes. It should coat the back of the wooden spoon.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-1-3"},{"@type":"HowToStep","text":"Remove from heat, add cheese, nutmeg, salt and pepper. Mix until the cheese is melted. The Sauce should be thick but still easily pourable - the consistency of heavy cream (you need to be able to drizzle it over the Ragu when layering - see video). If it's too thick, add a splash of water or milk.","name":"Remove from heat, add cheese, nutmeg, salt and pepper. Mix until the cheese is melted. The Sauce should be thick but still easily pourable - the consistency of heavy cream (you need to be able to drizzle it over the Ragu when layering - see video). If it's too thick, add a splash of water or milk.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-1-4"}]},{"@type":"HowToSection","name":"Assemble:","itemListElement":[{"@type":"HowToStep","text":"Preheat oven to 180°C\/350°F.","name":"Preheat oven to 180°C\/350°F.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-0"},{"@type":"HowToStep","text":"Use a 33 x 22 x 7 cm \/ 13 x 9 x 2.5\" baking dish.","name":"Use a 33 x 22 x 7 cm \/ 13 x 9 x 2.5\" baking dish.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-1"},{"@type":"HowToStep","text":"Smear a bit of Ragu on the base, then cover with lasagna sheets. Tear sheets to fit.","name":"Smear a bit of Ragu on the base, then cover with lasagna sheets. Tear sheets to fit.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-2"},{"@type":"HowToStep","text":"Spread over 2 1\/2 cups of Ragu (enough to cover sheets), then drizzle over 1 cup of Cheese Sauce.","name":"Spread over 2 1\/2 cups of Ragu (enough to cover sheets), then drizzle over 1 cup of Cheese Sauce.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-3"},{"@type":"HowToStep","text":"Top with lasagna sheets (Note 7). Spread with another 2 1\/2 cups of Ragu, then 1 cup of Cheese Sauce. Top with lasagna sheets then repeat 1 more time.","name":"Top with lasagna sheets (Note 7). Spread with another 2 1\/2 cups of Ragu, then 1 cup of Cheese Sauce. Top with lasagna sheets then repeat 1 more time.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-4"},{"@type":"HowToStep","text":"Top with a 4th layer of lasagna sheets, then pour over the remaining Cheese Sauce.","name":"Top with a 4th layer of lasagna sheets, then pour over the remaining Cheese Sauce.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-5"},{"@type":"HowToStep","text":"Sprinkle with Mozzarella, then bake for 25 minutes or until golden and bubbling.","name":"Sprinkle with Mozzarella, then bake for 25 minutes or until golden and bubbling.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-6"},{"@type":"HowToStep","text":"Stand for 5 to 10 minutes before cutting and serving, garnished with basil or parsley if desired.","name":"Stand for 5 to 10 minutes before cutting and serving, garnished with basil or parsley if desired.","url":"https:\/\/www.recipetineats.com\/lasagna\/#wprm-recipe-21417-step-2-7"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.93","ratingCount":"411","reviewCount":"8"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"I cooked your amazing Lasagna recipe today. My husband an
